version: '3.8'

services:
  backend:
    build: .
    container_name: watchgate-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/watchgate
      - API_KEY=${API_KEY:-change-me-to-a-secure-key}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: watchgate-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  mongo-data:
